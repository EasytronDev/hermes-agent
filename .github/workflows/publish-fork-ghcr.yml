name: Publish Fork Image (GHCR)

# Fork-owned publish lane. The upstream `docker.yml` gates every publish job on
# `github.repository == 'NousResearch/hermes-agent'`, so on this fork those jobs
# never run — and the fork has no Docker Hub secret. This lane publishes the
# fork's own image to GHCR under an OWN tag, using the GITHUB_TOKEN (no new
# secret required). It never touches `nousresearch/*`, and it never moves
# `stable`, `latest` or `v0.23.1`.
#
# The build reuses the fork's Dockerfile and the upstream's own stamp +
# profile-boundary steps, so the published bytes carry the same identity
# contract as the upstream lane.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to v0.23.1-kanban1).'
        required: false
        default: 'v0.23.1-kanban1'
      variant:
        description: 'Image variant: slim | desktop'
        required: false
        default: 'slim'
      arch:
        description: 'Architectures to build: "amd64,arm64" for the multi-arch manifest, or a single one for a single-arch tag.'
        required: false
        default: 'amd64,arm64'
  push:
    branches: ['feat/kanban-on-v0231']
    paths:
      - 'Dockerfile'
      - '.github/workflows/publish-fork-ghcr.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  # The fork's own namespace on GHCR. NOT nousresearch/* — that is upstream's.
  # Docker repository names must be lowercase; the GitHub owner is
  # `EasytronDev`, so the name is spelled out lowercased here.
  IMAGE_NAME: ghcr.io/easytrondev/hermes-agent
  CANDIDATE_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build and publish (${{ matrix.variant }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The dispatch input picks the legs. The emulated arm64 build on an
        # x64 runner is slow (the upstream uses native ARM runners, which the
        # fork has no access to), so a single-arch dispatch is supported.
        arch: ${{ fromJSON(inputs.arch || '["amd64","arm64"]') }}
        variant: [slim]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # The stamp and boundary scripts run on the runner's python3, whose
          # version depends on the runner image. Pin it instead of trusting it.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Write install stamp
        run: |
          display="$(python3 -m scripts.releases.distance)"
          identity=(--commit "$CANDIDATE_COMMIT")
          base="${display%%+*}"
          development="${display#*+}"
          if [ "$development" = "$display" ]; then distance=0; else distance="${development%%.*}"; fi
          identity+=(--base-version "$base" --display-version "$display" --distance "$distance")
          python3 scripts/write_install_stamp.py --output install-stamp.json \
            --distribution docker --update-mechanism external --source ci "${identity[@]}"
          cat install-stamp.json

      - name: Reject profile exports in the build context
        run: python3 scripts/ci/check_profile_archive_boundary.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant }}/${{ matrix.arch }})
        id: push
        uses: docker/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            HERMES_BOT_DESKTOP=${{ matrix.variant == 'desktop' && '1' || '0' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag || 'v0.23.1-kanban1' }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ env.CANDIDATE_COMMIT }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag || 'v0.23.1-kanban1' }}

      - name: Record pushed digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ inputs.tag || 'v0.23.1-kanban1' }}-${{ matrix.arch }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::Unexpected digest format: $digest"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed ${{ matrix.arch }} -> $digest"

  manifest:
    name: Assemble multi-arch manifest
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.receipt.outputs.image }}
      tag: ${{ steps.receipt.outputs.tag }}
      digest: ${{ steps.receipt.outputs.digest }}
      commit: ${{ steps.receipt.outputs.commit }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        id: manifest
        env:
          TAG: ${{ inputs.tag || 'v0.23.1-kanban1' }}
          ARCH_LIST: ${{ inputs.arch || 'amd64,arm64' }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra legs <<< "$ARCH_LIST"
          for arch in "${legs[@]}"; do
            args+=("${IMAGE_NAME}:${TAG}-${arch}")
          done
          echo "::notice::manifest legs: ${legs[*]}"
          for i in 1 2 3; do
            if docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" "${args[@]}"; then
              break
            fi
            if [ "$i" = 3 ]; then echo "::error::imagetools create failed after 3 attempts"; exit 1; fi
            echo "::warning::imagetools create failed (attempt $i); retrying in 20s"
            sleep 20
          done

      - name: Inspect and record the manifest digest
        id: digest
        env:
          TAG: ${{ inputs.tag || 'v0.23.1-kanban1' }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::Unexpected manifest digest: $digest"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::manifest ${IMAGE_NAME}:${TAG} -> $digest"

      # The revision label lives on the per-arch image CONFIG, not on the
      # multi-arch index (an index has no config of its own), so the check
      # walks each member of the index, reads its config blob and compares
      # the label with the candidate commit.
      - name: Verify the revision label matches the candidate commit
        env:
          TAG: ${{ inputs.tag || 'v0.23.1-kanban1' }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          ARCH_LIST: ${{ inputs.arch || 'amd64,arm64' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra legs <<< "$ARCH_LIST"
          for arch in "${legs[@]}"; do
            revision="$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}-${arch}" \
              --format '{{json .Image}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("org.opencontainers.image.revision",""))')"
            echo "${arch}: revision=${revision}"
            test "$revision" = "$CANDIDATE_COMMIT" || {
              echo "::error::${arch} revision label '${revision}' != candidate ${CANDIDATE_COMMIT}"
              exit 1
            }
          done
          echo "::notice::every leg carries org.opencontainers.image.revision=${CANDIDATE_COMMIT}"

      # A container package is PRIVATE by default. The deploy host pulls the
      # image by digest with no registry credential, so the package must be
      # public for the anonymous token to be issued — the same posture as the
      # public upstream registry. The owner is an organization, so the
      # org-scoped endpoint is the one that applies.
      - name: Make the package public so an anonymous pull works
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner_type="$(curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("type",""))')"
          case "$owner_type" in
            Organization) path="orgs/${GITHUB_REPOSITORY_OWNER}" ;;
            User)         path="users/${GITHUB_REPOSITORY_OWNER}" ;;
            *) echo "::error::Unknown owner type: $owner_type"; exit 1 ;;
          esac
          echo "owner endpoint: ${path}"
          for attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/visibility.json -w '%{http_code}' -X PATCH \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/${path}/packages/container/hermes-agent/visibility" \
              -d '{"visibility":"public"}')"
            echo "visibility PATCH attempt ${attempt}: HTTP ${code}"
            if [ "$code" = 200 ]; then break; fi
            cat /tmp/visibility.json
            if [ "$attempt" = 3 ]; then echo "::error::could not set visibility"; exit 1; fi
            sleep 15
          done
          cat /tmp/visibility.json

      - name: Prove the anonymous pull works
        env:
          TAG: ${{ inputs.tag || 'v0.23.1-kanban1' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            token="$(curl -sS \
              "https://ghcr.io/token?scope=repository:easytrondev/hermes-agent:pull&service=ghcr.io" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')"
            if [ -n "$token" ]; then
              echo "::notice::anonymous pull token issued on attempt ${attempt}"
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/easytrondev/hermes-agent/manifests/${TAG}")"
              echo "manifest HTTP ${code}"
              test "$code" = 200 || { echo "::error::manifest not pullable anonymously"; exit 1; }
              exit 0
            fi
            echo "::warning::anonymous token not issued yet (attempt ${attempt})"
            sleep 10
          done
          echo "::error::anonymous pull never became available"
          exit 1

      - name: Publish the digest as a job output
        id: receipt
        run: |
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || 'v0.23.1-kanban1' }}" >> "$GITHUB_OUTPUT"
          echo "digest=${{ steps.digest.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "commit=${CANDIDATE_COMMIT}" >> "$GITHUB_OUTPUT"
